# Local development only. These credentials are deliberately public and local.
name: prepcrew-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prepcrew
      POSTGRES_PASSWORD: prepcrew_local
      POSTGRES_DB: prepcrew
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepcrew -d prepcrew"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
