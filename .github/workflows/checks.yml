name: Portfolio checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prepcrew
          POSTGRES_PASSWORD: prepcrew_local
          POSTGRES_DB: prepcrew
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prepcrew -d prepcrew"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PYTHONPATH: backend
      E2E_ADMIN_DATABASE_URL: postgresql://prepcrew:prepcrew_local@127.0.0.1:5432/prepcrew
      DATABASE_TIMESCALE: 'false'
      GEMINI_API_KEY: ''
      ELEVENLABS_API_KEY: ''
      BACKBOARD_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m venv --system-site-packages .venv
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: python -m pytest backend/tests -q
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python backend/scripts/e2e.py
      - run: python backend/scripts/e2e.py --auth accounts.spec.ts connections.spec.ts
      - run: npm run check:app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-diagnostics
          path: |
            .artifacts/e2e/setup-error.log
            .artifacts/e2e/browser.log
            frontend/test-results/
